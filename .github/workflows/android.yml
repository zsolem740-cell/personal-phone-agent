name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/stable.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/stable.keystore" >> "$GITHUB_ENV"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build, lint, and run available unit tests
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest
      - name: Inspect APK identity permissions and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p app/build/reports/apk-diagnostics
          {
            echo "Source commit: $GITHUB_SHA"
            echo '=== SHA-256 ==='
            sha256sum "$APK"
            echo '=== Package metadata ==='
            "$TOOLS/aapt" dump badging "$APK"
            echo '=== Permissions ==='
            "$TOOLS/aapt" dump permissions "$APK"
            echo '=== Signature verification ==='
            "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
            echo 'Diagnostic metadata only; not a malware scan or safety certification.'
          } 2>&1 | tee app/build/reports/apk-diagnostics/report.txt
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: telefonasszisztens-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: app/build/reports/
          if-no-files-found: ignore
