name: Publish test APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apk-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/stable.keystore"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/stable.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Publish APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME="Telefonasszisztens-v0.9.4.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_NAME"
          sha256sum "$APK_NAME" > SHA256SUMS.txt
          TAG="test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" "$APK_NAME" SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title "Telefonasszisztens tesztverzio $TAG" --notes "Telepitheto teszt APK, stabil alairassal. Ez a kiadas nem biztonsagi tanusitas. A Google Play Protect egy korabbi valtozat telepiteset blokkolta; ennek oka meg nincs tisztazva, ezert ha a telefon figyelmeztet, ne keruldes meg a vedelmet. Forras commit: $GITHUB_SHA. Kozvetlen letolteshez a $APK_NAME fajlt valaszd, ne a Source code archivumot. Az elozo, ideiglenes alairasu verzio torlese utan telepitheto; azota az alairas mar nem valtozik, igy a jovobeli frissitesek a regi verzio fol telepulnek."
